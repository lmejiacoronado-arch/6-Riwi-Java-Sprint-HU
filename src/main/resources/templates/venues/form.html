<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Venue - Eventify Admin</title>
</head>
<body>
<h1>Create New Venue</h1>

<nav>
    <a href="/admin/venues">Back to Venues</a>
</nav>

<form th:action="@{/admin/venues}" th:object="${venue}" method="post">
    <div>
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" required>
    </div>

    <div>
        <label for="address">Address</label>
        <input type="text" id="address" th:field="*{address}" required>
    </div>

    <div>
        <label for="capacity">Capacity</label>
        <input type="number" id="capacity" th:field="*{capacity}" min="1" required>
    </div>

    <button type="submit">Save Venue</button>
</form>
</body>
</html>
