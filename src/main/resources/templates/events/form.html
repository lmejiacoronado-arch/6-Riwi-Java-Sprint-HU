<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Event - Eventify Admin</title>
</head>
<body>
<h1>Create New Event</h1>

<nav>
    <a th:href="@{/admin/events}">Back to Events</a>
</nav>

<p th:if="${errorMessage != null}" th:text="${errorMessage}" style="color: red;"></p>

<form th:action="@{/admin/events}" th:object="${event}" method="post">
    <div>
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" required>
    </div>

    <div>
        <label for="eventDate">Date</label>
        <input type="date" id="eventDate" th:field="*{eventDate}" required>
    </div>

    <div>
        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}"></textarea>
    </div>

    <div>
        <label for="venueId">Venue</label>
        <select id="venueId" name="venueId" required>
            <option value="">Select a venue</option>
            <option
                    th:each="venue : ${venues}"
                    th:value="${venue.id}"
                    th:text="${venue.name + ' - ' + venue.city + ' - Capacity: ' + venue.capacity}">
                Venue option
            </option>
        </select>
    </div>

    <fieldset>
        <legend>Categories</legend>

        <p th:if="${categories == null or #lists.isEmpty(categories)}">
            No categories available.
        </p>

        <div th:each="category : ${categories}">
            <input
                    type="checkbox"
                    name="categoryIds"
                    th:id="${'category-' + category.id}"
                    th:value="${category.id}">
            <label
                    th:for="${'category-' + category.id}"
                    th:text="${category.name}">
                Category
            </label>
        </div>
    </fieldset>

    <button type="submit">Save Event</button>
</form>
</body>
</html>
